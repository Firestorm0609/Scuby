<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireSprites — Character Showcase</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family:'Inter',sans-serif; background:#08090d; color:#e0e0e0; min-height:100vh; }
        
        .header { text-align:center; padding:60px 20px 40px; }
        .header h1 { font-family:'Space Mono',monospace; font-size:2.5em; color:#00e676; letter-spacing:4px; margin-bottom:10px; }
        .header p { color:#555; font-size:0.9em; }
        
        .showcase { display:flex; justify-content:center; gap:80px; padding:40px 20px 80px; flex-wrap:wrap; }
        
        .character { text-align:center; }
        .character svg { filter:drop-shadow(0 8px 24px rgba(0,0,0,0.5)); margin-bottom:20px; }
        .character-name { font-family:'Space Mono',monospace; font-size:1.2em; letter-spacing:2px; margin-bottom:5px; }
        .character-desc { font-size:0.8em; color:#555; }
        
        .floor-demo {
            max-width:800px; margin:0 auto; padding:40px 20px;
            background:#0f1117; border:1px solid #1a1d27; border-radius:12px;
            position:relative; height:200px; overflow:hidden;
        }
        .floor-demo .floor-label {
            position:absolute; top:10px; left:16px;
            font-family:'Space Mono',monospace; font-size:9px; color:#555;
            letter-spacing:2px; text-transform:uppercase;
        }
        
        .robot { position:absolute; transition:left 4s cubic-bezier(.4,0,.2,1), top 4s cubic-bezier(.4,0,.2,1); }
        .robot-walking svg { animation:bob 0.6s ease-in-out infinite; }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
        
        .footer { text-align:center; padding:40px; color:#333; font-size:0.7em; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FIRESPRITES</h1>
        <p>Animated SVG character sprites for web projects</p>
    </div>
    
    <div class="showcase">
        <div class="character">
            <svg width="80" height="104" viewBox="0 0 40 52" fill="none">
                <circle cx="20" cy="26" r="12" fill="#00e676" opacity="0.08"/>
                <rect x="8" y="16" width="24" height="20" rx="4" fill="#1a1d27" stroke="#00e676" stroke-width="1.5"/>
                <circle cx="20" cy="26" r="3" fill="#00e676" opacity="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
                <rect x="10" y="4" width="20" height="14" rx="3" fill="#1a1d27" stroke="#00e676" stroke-width="1.5"/>
                <circle cx="15" cy="10" r="2" fill="#00e676"><animate attributeName="r" values="2;0.5;2" dur="4s" repeatCount="indefinite"/></circle>
                <circle cx="25" cy="10" r="2" fill="#00e676"><animate attributeName="r" values="2;0.5;2" dur="4s" repeatCount="indefinite"/></circle>
                <line x1="20" y1="4" x2="20" y2="0" stroke="#00e676" stroke-width="1"/>
                <circle cx="20" cy="0" r="1.5" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
                <rect x="2" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/>
                <rect x="32" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/>
                <rect x="12" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/>
                <rect x="22" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/>
                <rect x="10" y="44" width="10" height="4" rx="2" fill="#00e676" opacity="0.6"/>
                <rect x="20" y="44" width="10" height="4" rx="2" fill="#00e676" opacity="0.6"/>
            </svg>
            <div class="character-name" style="color:#00e676">ALPHA</div>
            <div class="character-desc">Aggressive Scanner</div>
        </div>
        
        <div class="character">
            <svg width="80" height="104" viewBox="0 0 40 52" fill="none">
                <circle cx="20" cy="26" r="12" fill="#448aff" opacity="0.08"/>
                <rect x="8" y="16" width="24" height="20" rx="4" fill="#1a1d27" stroke="#448aff" stroke-width="1.5"/>
                <rect x="14" y="22" width="12" height="8" rx="1" fill="#448aff20" stroke="#448aff" stroke-width="0.5"/>
                <line x1="16" y1="24" x2="24" y2="24" stroke="#448aff" stroke-width="0.5" opacity="0.5"/>
                <line x1="16" y1="26" x2="22" y2="26" stroke="#448aff" stroke-width="0.5" opacity="0.5"/>
                <rect x="10" y="4" width="20" height="14" rx="3" fill="#1a1d27" stroke="#448aff" stroke-width="1.5"/>
                <rect x="13" y="8" width="5" height="3" rx="1" fill="#448aff"/>
                <rect x="22" y="8" width="5" height="3" rx="1" fill="#448aff"/>
                <line x1="20" y1="4" x2="20" y2="0" stroke="#448aff" stroke-width="1"/>
                <circle cx="20" cy="0" r="1.5" fill="#448aff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
                <rect x="2" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/>
                <rect x="32" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/>
                <rect x="12" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/>
                <rect x="22" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/>
                <rect x="10" y="44" width="10" height="4" rx="2" fill="#448aff" opacity="0.6"/>
                <rect x="20" y="44" width="10" height="4" rx="2" fill="#448aff" opacity="0.6"/>
            </svg>
            <div class="character-name" style="color:#448aff">BETA</div>
            <div class="character-desc">Conservative Analyzer</div>
        </div>
        
        <div class="character">
            <svg width="80" height="104" viewBox="0 0 40 52" fill="none">
                <circle cx="20" cy="26" r="12" fill="#ff9100" opacity="0.08"/>
                <rect x="8" y="16" width="24" height="20" rx="4" fill="#1a1d27" stroke="#ff9100" stroke-width="1.5"/>
                <circle cx="20" cy="26" r="5" fill="none" stroke="#ff9100" stroke-width="1"/>
                <circle cx="20" cy="26" r="2" fill="#ff9100" opacity="0.6"><animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/></circle>
                <rect x="10" y="4" width="20" height="14" rx="3" fill="#1a1d27" stroke="#ff9100" stroke-width="1.5"/>
                <path d="M14 10 L18 8 L22 12 L26 10" stroke="#ff9100" stroke-width="1.5" fill="none"/>
                <circle cx="14" cy="10" r="1" fill="#ff9100"/>
                <circle cx="26" cy="10" r="1" fill="#ff9100"/>
                <line x1="20" y1="4" x2="20" y2="0" stroke="#ff9100" stroke-width="1"/>
                <circle cx="20" cy="0" r="1.5" fill="#ff9100"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
                <rect x="2" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/>
                <rect x="32" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/>
                <rect x="12" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/>
                <rect x="22" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/>
                <rect x="10" y="44" width="10" height="4" rx="2" fill="#ff9100" opacity="0.6"/>
                <rect x="20" y="44" width="10" height="4" rx="2" fill="#ff9100" opacity="0.6"/>
            </svg>
            <div class="character-name" style="color:#ff9100">GAMMA</div>
            <div class="character-desc">Balanced Watcher</div>
        </div>
    </div>
    
    <!-- Walking Demo -->
    <div style="max-width:800px;margin:0 auto;padding:0 20px 40px;">
        <div style="font-family:'Space Mono',monospace;font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;text-align:center;">Walking Demo</div>
        <div class="floor-demo">
            <div class="floor-label">Floor</div>
            <div class="robot robot-walking" id="d1" style="left:20%;top:50%">
                <svg width="40" height="52" viewBox="0 0 40 52" fill="none"><circle cx="20" cy="26" r="12" fill="#00e676" opacity="0.08"/><rect x="8" y="16" width="24" height="20" rx="4" fill="#1a1d27" stroke="#00e676" stroke-width="1.5"/><circle cx="20" cy="26" r="3" fill="#00e676" opacity="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle><rect x="10" y="4" width="20" height="14" rx="3" fill="#1a1d27" stroke="#00e676" stroke-width="1.5"/><circle cx="15" cy="10" r="2" fill="#00e676"><animate attributeName="r" values="2;0.5;2" dur="4s" repeatCount="indefinite"/></circle><circle cx="25" cy="10" r="2" fill="#00e676"><animate attributeName="r" values="2;0.5;2" dur="4s" repeatCount="indefinite"/></circle><line x1="20" y1="4" x2="20" y2="0" stroke="#00e676" stroke-width="1"/><circle cx="20" cy="0" r="1.5" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle><rect x="2" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/><rect x="32" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/><rect x="12" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/><rect x="22" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#00e676" stroke-width="1"/><rect x="10" y="44" width="10" height="4" rx="2" fill="#00e676" opacity="0.6"/><rect x="20" y="44" width="10" height="4" rx="2" fill="#00e676" opacity="0.6"/></svg>
            </div>
            <div class="robot robot-walking" id="d2" style="left:50%;top:50%">
                <svg width="40" height="52" viewBox="0 0 40 52" fill="none"><circle cx="20" cy="26" r="12" fill="#448aff" opacity="0.08"/><rect x="8" y="16" width="24" height="20" rx="4" fill="#1a1d27" stroke="#448aff" stroke-width="1.5"/><rect x="14" y="22" width="12" height="8" rx="1" fill="#448aff20" stroke="#448aff" stroke-width="0.5"/><rect x="10" y="4" width="20" height="14" rx="3" fill="#1a1d27" stroke="#448aff" stroke-width="1.5"/><rect x="13" y="8" width="5" height="3" rx="1" fill="#448aff"/><rect x="22" y="8" width="5" height="3" rx="1" fill="#448aff"/><line x1="20" y1="4" x2="20" y2="0" stroke="#448aff" stroke-width="1"/><circle cx="20" cy="0" r="1.5" fill="#448aff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle><rect x="2" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/><rect x="32" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/><rect x="12" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/><rect x="22" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#448aff" stroke-width="1"/><rect x="10" y="44" width="10" height="4" rx="2" fill="#448aff" opacity="0.6"/><rect x="20" y="44" width="10" height="4" rx="2" fill="#448aff" opacity="0.6"/></svg>
            </div>
            <div class="robot robot-walking" id="d3" style="left:80%;top:50%">
                <svg width="40" height="52" viewBox="0 0 40 52" fill="none"><circle cx="20" cy="26" r="12" fill="#ff9100" opacity="0.08"/><rect x="8" y="16" width="24" height="20" rx="4" fill="#1a1d27" stroke="#ff9100" stroke-width="1.5"/><circle cx="20" cy="26" r="5" fill="none" stroke="#ff9100" stroke-width="1"/><circle cx="20" cy="26" r="2" fill="#ff9100" opacity="0.6"><animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/></circle><rect x="10" y="4" width="20" height="14" rx="3" fill="#1a1d27" stroke="#ff9100" stroke-width="1.5"/><path d="M14 10 L18 8 L22 12 L26 10" stroke="#ff9100" stroke-width="1.5" fill="none"/><circle cx="14" cy="10" r="1" fill="#ff9100"/><circle cx="26" cy="10" r="1" fill="#ff9100"/><line x1="20" y1="4" x2="20" y2="0" stroke="#ff9100" stroke-width="1"/><circle cx="20" cy="0" r="1.5" fill="#ff9100"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle><rect x="2" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/><rect x="32" y="20" width="6" height="12" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/><rect x="12" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/><rect x="22" y="36" width="6" height="10" rx="2" fill="#1a1d27" stroke="#ff9100" stroke-width="1"/><rect x="10" y="44" width="10" height="4" rx="2" fill="#ff9100" opacity="0.6"/><rect x="20" y="44" width="10" height="4" rx="2" fill="#ff9100" opacity="0.6"/></svg>
            </div>
        </div>
    </div>
    
    <div class="footer">FireSprites — Free SVG character sprites</div>
    
    <script>
        ['d1','d2','d3'].forEach(id=>{
            setInterval(()=>{
                const el=document.getElementById(id);
                el.style.left=(5+Math.random()*85)+'%';
                el.style.top=(20+Math.random()*60)+'%';
            },3000+Math.random()*2000);
        });
    </script>
</body>
</html>
