# ═══════════════════════════════════════════════════════════
# 🤖 AI Memecoin Trading Agent — Configuration
# ═══════════════════════════════════════════════════════════

agent:
  name: "Buffy"
  version: "1.0.0"

llm:
  provider: "ollama"
  model: "llama3"
  base_url: "http://localhost:11434"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

wallet:
  keypair_path: "./wallet.json"
  network: "mainnet-beta"

trading:
  starting_balance: 0.5
  max_position_pct: 0.05
  max_open_positions: 3
  stop_loss_pct: -0.30
  take_profit_pct: 0.50

scan:
  interval_seconds: 60
  sources:
    - "pump.fun"

risk:
  min_holders: 10
  max_dev_holding_pct: 0.20
  min_liquidity_usd: 1000
  max_daily_trades: 20
  max_daily_loss_sol: 0.1
  min_balance_sol: 0.1
  max_slippage_pct: 5
  blacklist: []

alerts:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

logging:
  level: "INFO"
  file: "./logs/agent.log"
