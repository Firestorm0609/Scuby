<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODEBUFF Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --bg-4: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --text-muted: #484f58;
    --accent: #58a6ff; --accent-2: #3fb950; --accent-3: #d2a8ff; --accent-4: #f0883e;
    --red: #f85149; --yellow: #d29922; --cyan: #39d2c0; --pink: #f778ba;
    --border: #30363d; --radius: 6px;
    --font-code: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    --font-ui: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border); min-height: 42px; flex-shrink: 0; }
  .topbar .logo { font-weight: 800; font-size: 14px; letter-spacing: 1px; color: var(--accent); margin-right: 8px; }
  .topbar .logo span { color: var(--text-dim); font-weight: 500; letter-spacing: 0; }

  /* Tabs */
  .tabs { display: flex; gap: 1px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: var(--bg-3); color: var(--text-dim); font-size: 12px; font-weight: 500; cursor: pointer; border: none; white-space: nowrap; border-radius: var(--radius) var(--radius) 0 0; transition: background .1s; }
  .tab:hover { background: var(--bg-4); color: var(--text); }
  .tab.active { background: var(--bg); color: var(--text); }
  .tab .close { opacity: 0; font-size: 14px; line-height: 1; padding: 2px; }
  .tab:hover .close { opacity: 0.5; }
  .tab .close:hover { opacity: 1; color: var(--red); }
  .tab-add { padding: 6px 10px; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }
  .tab-add:hover { color: var(--accent); }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .toolbar select, .toolbar button, .toolbar input {
    font-family: var(--font-ui); font-size: 11px; font-weight: 600; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-3); color: var(--text); cursor: pointer; letter-spacing: 0.3px;
  }
  .toolbar select:hover, .toolbar button:hover { background: var(--bg-4); border-color: var(--text-muted); }
  .toolbar button.accent { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .toolbar button.accent:hover { opacity: 0.85; }
  .toolbar button.green { background: var(--accent-2); color: var(--bg); border-color: var(--accent-2); }
  .toolbar button.green:hover { opacity: 0.85; }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .toolbar .spacer { flex: 1; }
  .toolbar .info { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; }

  /* URL bar */
  .urlbar { display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .urlbar input { flex: 1; font-family: var(--font-code); font-size: 11px; padding: 5px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); }
  .urlbar input:focus { outline: none; border-color: var(--accent); }
  .urlbar button { font-family: var(--font-ui); font-size: 11px; font-weight: 600; padding: 5px 12px; background: var(--accent); color: var(--bg); border: none; border-radius: var(--radius); cursor: pointer; }
  .urlbar button:hover { opacity: 0.85; }
  .urlbar .hint { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

  /* Editor area */
  .editor-wrap { flex: 1; display: flex; overflow: hidden; position: relative; }
  .line-numbers {
    width: 52px; background: var(--bg-2); color: var(--text-muted); text-align: right;
    padding: 12px 8px 12px 0; font-family: var(--font-code); font-size: 13px; line-height: 1.6;
    overflow: hidden; user-select: none; flex-shrink: 0; border-right: 1px solid var(--border);
  }
  .editor-container { flex: 1; position: relative; overflow: auto; }
  .editor-container textarea {
    position: absolute; inset: 0; width: 100%; height: 100%; padding: 12px 16px;
    font-family: var(--font-code); font-size: 13px; line-height: 1.6; color: transparent;
    caret-color: var(--text); background: transparent; border: none; outline: none;
    resize: none; tab-size: 2; white-space: pre; overflow: auto; z-index: 2;
  }
  .editor-container pre {
    position: absolute; inset: 0; padding: 12px 16px;
    font-family: var(--font-code); font-size: 13px; line-height: 1.6;
    white-space: pre; overflow: auto; pointer-events: none; z-index: 1;
  }

  /* Syntax colors */
  .kw { color: var(--accent-3); } .str { color: var(--accent-2); } .num { color: var(--accent-4); }
  .cmt { color: var(--text-muted); font-style: italic; } .fn { color: var(--accent); }
  .op { color: var(--red); } .tag { color: var(--accent); } .attr { color: var(--accent-3); }
  .val { color: var(--accent-2); } .type { color: var(--yellow); } .prop { color: var(--cyan); }
  .punc { color: var(--text-dim); } .bool { color: var(--accent-4); }

  /* Status bar */
  .statusbar { display: flex; align-items: center; gap: 12px; padding: 3px 12px; background: var(--bg-3); border-top: 1px solid var(--border); font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; flex-shrink: 0; }
  .statusbar .right { margin-left: auto; display: flex; gap: 12px; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 500px; width: 90%; }
  .modal h3 { font-size: 16px; margin-bottom: 12px; }
  .modal .file-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
  .modal .file-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; cursor: pointer; }
  .modal .file-item:hover { background: var(--bg-3); }
  .modal .file-item .fname { flex: 1; }
  .modal .file-item .fsize { color: var(--text-muted); }
  .modal .file-item .fdel { color: var(--red); cursor: pointer; opacity: 0.5; }
  .modal .file-item .fdel:hover { opacity: 1; }
  .modal button { font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-3); color: var(--text); cursor: pointer; }
  .modal button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .modal button.danger { background: var(--red); color: #fff; border-color: var(--red); }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Toast */
  .toast { position: fixed; bottom: 40px; right: 16px; background: var(--accent-2); color: var(--bg); padding: 8px 16px; border-radius: var(--radius); font-size: 12px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CODEBUFF <span>editor</span></div>
  <div class="tabs" id="tabs"></div>
  <button class="tab-add" id="newTabBtn" title="New file">+</button>
</div>

<div class="toolbar">
  <select id="langSelect">
    <option value="auto">Auto Detect</option>
    <option value="javascript">JavaScript</option>
    <option value="python">Python</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="json">JSON</option>
    <option value="markdown">Markdown</option>
    <option value="bash">Bash</option>
    <option value="sql">SQL</option>
    <option value="java">Java</option>
    <option value="c">C</option>
    <option value="cpp">C++</option>
    <option value="rust">Rust</option>
    <option value="go">Go</option>
    <option value="typescript">TypeScript</option>
    <option value="php">PHP</option>
    <option value="ruby">Ruby</option>
    <option value="yaml">YAML</option>
    <option value="xml">XML</option>
    <option value="plaintext">Plain Text</option>
  </select>
  <div class="sep"></div>
  <button id="formatBtn" title="Auto-format code">Format</button>
  <button id="minifyBtn" title="Minify code">Minify</button>
  <button id="wrapBtn" title="Toggle word wrap">Wrap</button>
  <div class="sep"></div>
  <button id="copyBtn" class="accent">Copy</button>
  <button id="downloadBtn">Download</button>
  <button id="saveBtn" class="green">Save</button>
  <button id="loadBtn">Load</button>
  <div class="spacer"></div>
  <span class="info" id="editorInfo">Ln 1, Col 1</span>
</div>

<div class="urlbar">
  <span class="hint">LOAD FROM URL:</span>
  <input type="text" id="urlInput" placeholder="Paste a URL (raw GitHub, dpaste, hastebin, etc.)">
  <button id="loadUrlBtn">Load</button>
</div>

<div class="editor-wrap">
  <div class="line-numbers" id="lineNumbers">1</div>
  <div class="editor-container">
    <pre id="highlightLayer"></pre>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  </div>
</div>

<div class="statusbar">
  <span id="statusLang">Plain Text</span>
  <span id="statusSize">0 chars</span>
  <div class="right">
    <span id="statusSaved">Unsaved</span>
    <span>UTF-8</span>
    <span>Spaces: 2</span>
  </div>
</div>

<!-- Save/Load Modal -->
<div class="modal-bg" id="filesModal">
  <div class="modal">
    <h3 id="modalTitle">Saved Files</h3>
    <div class="file-list" id="fileList"></div>
    <div class="actions">
      <button id="modalCloseBtn">Close</button>
      <button id="modalClearBtn" class="danger">Clear All</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- State ----
let files = []; // [{id, name, lang, content, saved}]
let activeId = null;

const editor = document.getElementById('editor');
const highlightLayer = document.getElementById('highlightLayer');
const lineNumbers = document.getElementById('lineNumbers');
const tabsEl = document.getElementById('tabs');
const langSelect = document.getElementById('langSelect');
const editorInfo = document.getElementById('editorInfo');
const statusLang = document.getElementById('statusLang');
const statusSize = document.getElementById('statusSize');
const statusSaved = document.getElementById('statusSaved');
const toast = document.getElementById('toast');

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function newFile(name, content, lang) {
  const id = uid();
  files.push({ id, name: name || 'untitled', lang: lang || 'auto', content: content || '', saved: false });
  activeId = id;
  renderTabs();
  loadEditor();
  return id;
}

function getActive() { return files.find(f => f.id === activeId); }

// ---- Tabs ----
function renderTabs() {
  tabsEl.innerHTML = '';
  files.forEach(f => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (f.id === activeId ? ' active' : '');
    tab.innerHTML = `<span>${f.name}</span><span class="close" data-id="${f.id}">&times;</span>`;
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('close')) {
        closeTab(e.target.dataset.id);
      } else {
        activeId = f.id;
        renderTabs();
        loadEditor();
      }
    });
    tabsEl.appendChild(tab);
  });
}

function closeTab(id) {
  const f = files.find(x => x.id === id);
  if (f && !f.saved && f.content.trim()) {
    if (!confirm(`Close "${f.name}" without saving?`)) return;
  }
  files = files.filter(x => x.id !== id);
  if (activeId === id) {
    activeId = files.length ? files[files.length - 1].id : null;
    if (!activeId) newFile();
  }
  renderTabs();
  loadEditor();
}

// ---- Editor ----
function loadEditor() {
  const f = getActive();
  if (!f) return;
  editor.value = f.content;
  if (f.lang !== 'auto') langSelect.value = f.lang;
  else langSelect.value = 'auto';
  updateHighlight();
  updateLineNumbers();
  updateStatus();
  saveToLocal();
}

editor.addEventListener('input', () => {
  const f = getActive();
  if (!f) return;
  f.content = editor.value;
  f.saved = false;
  updateHighlight();
  updateLineNumbers();
  updateStatus();
  saveToLocal();
});

editor.addEventListener('scroll', () => {
  highlightLayer.scrollTop = editor.scrollTop;
  highlightLayer.scrollLeft = editor.scrollLeft;
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    editor.dispatchEvent(new Event('input'));
  }
  // Auto-close brackets
  const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
  if (pairs[e.key]) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    if (start !== end) {
      e.preventDefault();
      const sel = editor.value.substring(start, end);
      editor.value = editor.value.substring(0, start) + e.key + sel + pairs[e.key] + editor.value.substring(end);
      editor.selectionStart = start + 1;
      editor.selectionEnd = end + 1;
      editor.dispatchEvent(new Event('input'));
    }
  }
});

editor.addEventListener('click', updateStatus);
editor.addEventListener('keyup', updateStatus);

// ---- Language Detection ----
function detectLang(code) {
  if (/^\s*\{[\s\S]*"[\w]+":\s/.test(code) || /^\s*\[[\s\S]*\]/.test(code)) return 'json';
  if (/^\s*<!DOCTYPE|^\s*<html|^\s*<div|^\s*<span|^\s*<head|^\s*<body/i.test(code)) return 'html';
  if (/^\s*import\s+.*from\s+['"]/.test(code) || /=>\s*\{|const\s+\w+\s*=.*=>/.test(code)) return 'javascript';
  if (/^\s*def\s+\w+\s*\(|^\s*class\s+\w+.*:$|^\s*import\s+\w+/m.test(code)) return 'python';
  if (/^\s*function\s+\w+|^\s*const\s+\w+\s*=|^\s*let\s+\w+\s*=|^\s*var\s+\w+\s*=/.test(code)) return 'javascript';
  if (/^\s*\w+\s*\{[\s\S]*:\s*[^;]+;/.test(code) || /^\s*\.[a-zA-Z]/m.test(code)) return 'css';
  if (/^\s*#include\s+<|^\s*int\s+main\s*\(/.test(code)) return 'c';
  if (/^\s*fn\s+\w+|^\s*let\s+mut\s+/.test(code)) return 'rust';
  if (/^\s*func\s+\w+|^\s*package\s+\w+/.test(code)) return 'go';
  if (/^\s*SELECT\s+|^\s*INSERT\s+|^\s*CREATE\s+TABLE/i.test(code)) return 'sql';
  if (/^\s*<\?php/.test(code)) return 'php';
  if (/^\s*#!/.test(code) || /^\s*echo\s|^\s*if\s*\[/.test(code)) return 'bash';
  return 'plaintext';
}

function getLang() {
  const v = langSelect.value;
  if (v === 'auto') {
    const f = getActive();
    return f ? detectLang(f.content) : 'plaintext';
  }
  return v;
}

langSelect.addEventListener('change', () => {
  const f = getActive();
  if (f) { f.lang = langSelect.value; saveToLocal(); }
  updateStatus();
  updateHighlight();
});

// ---- Syntax Highlighting ----
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const HIGHLIGHT_RULES = {
  javascript: [
    { regex: /(\/\/.*$)/gm, cls: 'cmt' },
    { regex: /(\/\*[\s\S]*?\*\/)/g, cls: 'cmt' },
    { regex: /(`[\s\S]*?`)/g, cls: 'str' },
    { regex: /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, cls: 'str' },
    { regex: /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|this|class|extends|import|export|from|default|async|await|try|catch|finally|throw|typeof|instanceof|in|of|yield|null|undefined|void)\b/g, cls: 'kw' },
    { regex: /\b(true|false)\b/g, cls: 'bool' },
    { regex: /\b(\d+\.?\d*)\b/g, cls: 'num' },
    { regex: /\b([A-Z]\w*)\b/g, cls: 'type' },
    { regex: /(\w+)\s*(?=\()/g, cls: 'fn' },
    { regex: /(=>|[+\-*/%=!<>&|^~?:]+)/g, cls: 'op' },
  ],
  python: [
    { regex: /(#.*$)/gm, cls: 'cmt' },
    { regex: /("""[\s\S]*?"""|'''[\s\S]*?''')/g, cls: 'str' },
    { regex: /(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')/g, cls: 'str' },
    { regex: /\b(def|class|return|if|elif|else|for|while|break|continue|import|from|as|with|try|except|finally|raise|pass|lambda|yield|global|nonlocal|assert|del|in|not|and|or|is|None|True|False|self|print)\b/g, cls: 'kw' },
    { regex: /\b(True|False)\b/g, cls: 'bool' },
    { regex: /\b(\d+\.?\d*)\b/g, cls: 'num' },
    { regex: /\b([A-Z]\w*)\b/g, cls: 'type' },
    { regex: /(\w+)\s*(?=\()/g, cls: 'fn' },
    { regex: /(>=|<=|!=|==|[+\-*/%=<>&|^~@]+)/g, cls: 'op' },
  ],
  html: [
    { regex: /(<!--[\s\S]*?-->)/g, cls: 'cmt' },
    { regex: /(&lt;\/?)([\w-]+)/g, cls: 'tag', replace: '$1<span class="tag">$2</span>' },
    { regex: /\s([\w-]+)(?==)/g, cls: 'attr' },
    { regex: /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, cls: 'val' },
  ],
  css: [
    { regex: /(\/\*[\s\S]*?\*\/)/g, cls: 'cmt' },
    { regex: /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, cls: 'str' },
    { regex: /(#[0-9a-fA-F]{3,8})\b/g, cls: 'num' },
    { regex: /\b(\d+\.?\d*(px|em|rem|%|vh|vw|s|ms)?)\b/g, cls: 'num' },
    { regex: /@(media|keyframes|import|font-face|supports|property)\b/g, cls: 'kw' },
    { regex: /\b(none|auto|inherit|initial|normal|bold|italic|flex|grid|block|inline|relative|absolute|fixed|sticky)\b/g, cls: 'kw' },
    { regex: /([.#][\w-]+)(?=\s*\{)/g, cls: 'fn' },
    { regex: /([\w-]+)\s*(?=:)/g, cls: 'prop' },
  ],
  json: [
    { regex: /("(?:[^"\\]|\\.)*")\s*(?=:)/g, cls: 'prop' },
    { regex: /:\s*("(?:[^"\\]|\\.)*")/g, cls: 'str' },
    { regex: /\b(true|false|null)\b/g, cls: 'bool' },
    { regex: /\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g, cls: 'num' },
  ],
  bash: [
    { regex: /(#.*$)/gm, cls: 'cmt' },
    { regex: /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, cls: 'str' },
    { regex: /\b(if|then|else|elif|fi|for|while|do|done|case|esac|function|return|exit|echo|export|source|alias|unalias|sudo|cd|ls|mkdir|rm|cp|mv|cat|grep|sed|awk|chmod|chown|curl|wget|apt|npm|pip|git)\b/g, cls: 'kw' },
    { regex: /\$(\w+|\{[^}]+\})/g, cls: 'num' },
    { regex: /\b(\d+)\b/g, cls: 'num' },
  ],
  markdown: [
    { regex: /^(#{1,6}\s.*)$/gm, cls: 'kw' },
    { regex: /(\*\*.*?\*\*|__.*?__)/g, cls: 'fn' },
    { regex: /(\*.*?\*|_.*?_)/g, cls: 'type' },
    { regex: /(`[^`]+`)/g, cls: 'str' },
    { regex: /(\[.*?\]\(.*?\))/g, cls: 'attr' },
    { regex: /^(\s*[-*+]\s)/gm, cls: 'op' },
    { regex: /^(\s*\d+\.\s)/gm, cls: 'op' },
  ],
  sql: [
    { regex: /(--.*$)/gm, cls: 'cmt' },
    { regex: /(\/\*[\s\S]*?\*\/)/g, cls: 'cmt' },
    { regex: /('(?:[^'\\]|\\.)*')/g, cls: 'str' },
    { regex: /\b(SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|INDEX|JOIN|INNER|LEFT|RIGHT|OUTER|ON|AND|OR|NOT|IN|IS|NULL|AS|ORDER|BY|GROUP|HAVING|LIMIT|OFFSET|DISTINCT|COUNT|SUM|AVG|MAX|MIN|CASE|WHEN|THEN|ELSE|END|PRIMARY|KEY|FOREIGN|REFERENCES|CONSTRAINT|UNIQUE|CHECK|DEFAULT|AUTO_INCREMENT|VARCHAR|INT|INTEGER|TEXT|BOOLEAN|DATE|TIMESTAMP|FLOAT|DOUBLE|DECIMAL)\b/gi, cls: 'kw' },
    { regex: /\b(\d+\.?\d*)\b/g, cls: 'num' },
  ],
  typescript: null, // use javascript rules
  c: null, cpp: null, java: null, go: null, rust: null, php: null, ruby: null, yaml: null, xml: null,
};

// Fallback highlighting for unsupported languages
function fallbackHighlight(code, lang) {
  let h = escapeHtml(code);
  // Comments
  h = h.replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>');
  h = h.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>');
  h = h.replace(/(#.*$)/gm, '<span class="cmt">$1</span>');
  // Strings
  h = h.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;|'(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>');
  // Numbers
  h = h.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  return h;
}

function highlight(code, lang) {
  const rules = HIGHLIGHT_RULES[lang];
  if (!rules) return fallbackHighlight(code, lang);

  // Token-based highlighting to avoid overlapping
  let h = escapeHtml(code);
  const tokens = [];
  let placeholder = '\x00';

  rules.forEach(rule => {
    h = h.replace(rule.regex, (...args) => {
      const match = args[0];
      const token = placeholder + tokens.length + placeholder;
      tokens.push(rule.replace ? match.replace(rule.regex, rule.replace) : `<span class="${rule.cls}">${escapeHtml(match)}</span>`);
      return token;
    });
  });

  // Restore tokens
  tokens.forEach((t, i) => {
    h = h.replace(new RegExp(placeholder.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + i + placeholder.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), t);
  });

  return h;
}

function updateHighlight() {
  const f = getActive();
  if (!f) return;
  const lang = getLang();
  const code = f.content;
  if (lang === 'plaintext') {
    highlightLayer.innerHTML = escapeHtml(code);
  } else {
    highlightLayer.innerHTML = highlight(code, lang);
  }
  // Update status language name
  const names = { javascript:'JavaScript', typescript:'TypeScript', python:'Python', html:'HTML', css:'CSS', json:'JSON', markdown:'Markdown', bash:'Bash', sql:'SQL', java:'Java', c:'C', cpp:'C++', rust:'Rust', go:'Go', php:'PHP', ruby:'Ruby', yaml:'YAML', xml:'XML', plaintext:'Plain Text' };
  statusLang.textContent = names[lang] || lang;
}

// ---- Line Numbers ----
function updateLineNumbers() {
  const lines = (editor.value || '').split('\n').length;
  lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
}

// ---- Status Bar ----
function updateStatus() {
  const pos = editor.selectionStart;
  const text = editor.value.substring(0, pos);
  const lines = text.split('\n');
  const ln = lines.length;
  const col = lines[lines.length - 1].length + 1;
  editorInfo.textContent = `Ln ${ln}, Col ${col}`;
  statusSize.textContent = `${editor.value.length.toLocaleString()} chars`;
  const f = getActive();
  statusSaved.textContent = f && f.saved ? 'Saved' : 'Unsaved';
}

// ---- Auto Format ----
function autoFormat(code, lang) {
  if (lang === 'json') {
    try { return JSON.stringify(JSON.parse(code), null, 2); } catch(e) { return code; }
  }
  if (lang === 'javascript' || lang === 'typescript') {
    // Basic indent fix
    let indent = 0; const lines = code.split('\n'); const out = [];
    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) { out.push(''); continue; }
      if (/^[}\])]/.test(trimmed)) indent = Math.max(0, indent - 1);
      out.push('  '.repeat(indent) + trimmed);
      if (/[{(\[]$/.test(trimmed) && !/^[}\])]/.test(trimmed)) indent++;
      // Handle single-line then/catch
      if (/^(else|catch|finally)\b/.test(trimmed) && /[}\])]/.test(line.replace(/^(else|catch|finally)\b/, ''))) indent++;
    }
    return out.join('\n');
  }
  if (lang === 'html' || lang === 'xml') {
    let indent = 0; const lines = code.replace(/>\s*</g, '>\n<').split('\n'); const out = [];
    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      if (/^<\//.test(trimted)) indent = Math.max(0, indent - 1);
      out.push('  '.repeat(indent) + trimmed);
      if (/^<[^/!][^>]*[^/]>$/.test(trimmed) && !/^<(br|hr|img|input|meta|link)\b/i.test(trimmed)) indent++;
    }
    return out.join('\n');
  }
  if (lang === 'css') {
    let indent = 0; const lines = code.split('\n'); const out = [];
    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      if (trimmed === '}') indent = Math.max(0, indent - 1);
      out.push('  '.repeat(indent) + trimmed);
      if (trimmed.endsWith('{')) indent++;
    }
    return out.join('\n');
  }
  if (lang === 'python') {
    // Minimal: just remove trailing spaces, ensure newline at end
    return code.split('\n').map(l => l.trimEnd()).join('\n').trimEnd() + '\n';
  }
  return code;
}

function autoMinify(code, lang) {
  if (lang === 'json') {
    try { return JSON.stringify(JSON.parse(code)); } catch(e) { return code; }
  }
  if (lang === 'html') {
    return code.replace(/>\s+</g, '><').replace(/\s{2,}/g, ' ').trim();
  }
  if (lang === 'css') {
    return code.replace(/\s*{\s*/g, '{').replace(/\s*}\s*/g, '}').replace(/\s*:\s*/g, ':').replace(/\s*;\s*/g, ';').replace(/\s*,\s*/g, ',').trim();
  }
  return code.split('\n').map(l => l.trim()).filter(Boolean).join('\n');
}

document.getElementById('formatBtn').addEventListener('click', () => {
  const f = getActive(); if (!f) return;
  const lang = getLang();
  f.content = autoFormat(f.content, lang);
  editor.value = f.content;
  updateHighlight(); updateLineNumbers(); saveToLocal();
  toast.show('Formatted'); setTimeout(() => toast.classList.remove('show'), 1500);
});

document.getElementById('minifyBtn').addEventListener('click', () => {
  const f = getActive(); if (!f) return;
  const lang = getLang();
  f.content = autoMinify(f.content, lang);
  editor.value = f.content;
  updateHighlight(); updateLineNumbers(); saveToLocal();
  toast.show('Minified'); setTimeout(() => toast.classList.remove('show'), 1500);
});

// ---- Word Wrap ----
let wrapEnabled = false;
document.getElementById('wrapBtn').addEventListener('click', () => {
  wrapEnabled = !wrapEnabled;
  editor.style.whiteSpace = wrapEnabled ? 'pre-wrap' : 'pre';
  highlightLayer.style.whiteSpace = wrapEnabled ? 'pre-wrap' : 'pre';
  document.getElementById('wrapBtn').style.background = wrapEnabled ? 'var(--accent)' : '';
  document.getElementById('wrapBtn').style.color = wrapEnabled ? 'var(--bg)' : '';
});

// ---- Copy ----
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(editor.value).then(() => {
    toast.show('Copied!'); setTimeout(() => toast.classList.remove('show'), 1500);
  });
});

// ---- Download ----
document.getElementById('downloadBtn').addEventListener('click', () => {
  const f = getActive(); if (!f) return;
  const exts = { javascript:'.js', typescript:'.ts', python:'.py', html:'.html', css:'.css', json:'.json', markdown:'.md', bash:'.sh', sql:'.sql', java:'.java', c:'.c', cpp:'.cpp', rust:'.rs', go:'.go', php:'.php', ruby:'.rb', yaml:'.yml', xml:'.xml', plaintext:'.txt' };
  const lang = getLang();
  const ext = exts[lang] || '.txt';
  const name = f.name.includes('.') ? f.name : f.name + ext;
  const blob = new Blob([f.content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

// ---- LocalStorage ----
const LS_KEY = 'codebuff-files';
function saveToLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(files)); } catch(e) {}
}
function loadFromLocal() {
  try {
    const data = JSON.parse(localStorage.getItem(LS_KEY));
    if (data && data.length) {
      files = data;
      activeId = files[0].id;
      renderTabs();
      loadEditor();
      return;
    }
  } catch(e) {}
  newFile();
}

// ---- Save/Load Modal ----
document.getElementById('saveBtn').addEventListener('click', () => {
  const f = getActive(); if (!f) return;
  const name = prompt('File name:', f.name);
  if (name) {
    f.name = name;
    f.saved = true;
    renderTabs();
    saveToLocal();
    toast.show('Saved!'); setTimeout(() => toast.classList.remove('show'), 1500);
  }
});

document.getElementById('loadBtn').addEventListener('click', () => {
  const modal = document.getElementById('filesModal');
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  if (!files.length) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px;">No saved files</div>';
  }
  files.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span class="fname">${f.name}</span><span class="fsize">${f.content.length.toLocaleString()} chars</span><span class="fdel" data-id="${f.id}">&times;</span>`;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('fdel')) {
        files = files.filter(x => x.id !== e.target.dataset.id);
        if (activeId === e.target.dataset.id) {
          activeId = files.length ? files[0].id : null;
          if (!activeId) newFile();
        }
        renderTabs(); loadEditor(); saveToLocal();
        document.getElementById('loadBtn').click(); // refresh modal
        return;
      }
      activeId = f.id;
      renderTabs(); loadEditor();
      modal.classList.remove('open');
    });
    list.appendChild(item);
  });
  modal.classList.add('open');
});

document.getElementById('modalCloseBtn').addEventListener('click', () => {
  document.getElementById('filesModal').classList.remove('open');
});
document.getElementById('modalClearBtn').addEventListener('click', () => {
  if (confirm('Delete ALL saved files?')) {
    files = []; activeId = null; newFile();
    saveToLocal();
    document.getElementById('filesModal').classList.remove('open');
    toast.show('Cleared'); setTimeout(() => toast.classList.remove('show'), 1500);
  }
});

// ---- URL Loading ----
document.getElementById('loadUrlBtn').addEventListener('click', loadFromUrl);
document.getElementById('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadFromUrl(); });

async function loadFromUrl() {
  const raw = document.getElementById('urlInput').value.trim();
  if (!raw) return;
  const urls = [
    raw,
    raw.replace('https://github.com/', 'https://raw.githubusercontent.com/').replace('/blob/', '/'),
    raw.replace('https://gist.github.com/', 'https://gist.githubusercontent.com/').replace(/\/[a-f0-9]+$/, (m) => m + '/raw'),
    raw.replace('https://dpaste.org/', 'https://dpaste.org/api/'),
    raw.replace('https://hastebin.com/', 'https://hastebin.com/raw/'),
  ];
  let loaded = false;
  for (const url of urls) {
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const text = await resp.text();
        if (text.length > 0 && text.length < 5_000_000) {
          const name = url.split('/').pop().split('?')[0] || 'remote-file';
          newFile(name, text);
          toast.show('Loaded from URL!'); setTimeout(() => toast.classList.remove('show'), 1500);
          loaded = true;
          break;
        }
      }
    } catch(e) { continue; }
  }
  if (!loaded) toast.show('Failed to load URL'); setTimeout(() => toast.classList.remove('show'), 1500);
}

// ---- New Tab ----
document.getElementById('newTabBtn').addEventListener('click', () => newFile());

// ---- Init ----
loadFromLocal();
</script>
